name: Reproduce cipher evidence
on: [push, pull_request, workflow_dispatch]
jobs:
  offline-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check repository boundary, scientific hashes and case certificates
        run: python -B scripts/verify_portfolio.py --replay
      - name: Check accidental-publication rejection
        run: python -B -m unittest discover -s tests
      - name: Replay portable catalogue metadata controls
        run: python -B research/catalogue_metadata/check_parser_controls.py
      - name: Replay static-loader synthetic controls
        run: node research/catalogue_metadata/static_loader/check_controls.mjs
      - name: Replay target-independent indexed-cell controls
        run: node scripts/verify_methods.mjs
      - name: Verify frozen wordless Czech substitution controls
        run: python -B methods/czech_wordless_masc/verify_frozen.py
      - name: Verify frozen masked wordless Czech controls
        run: python -B methods/czech_wordless_masked_masc/verify_frozen.py
      - name: Check fixed-budget masked runtime interfaces
        run: python -B methods/czech_masked_bounded_runtime/verify_runtime.py
      - name: Check completed historical-trial evidence and refusal fixtures
        run: |
          python -B research/trials/hc1527_fixed_model_v1/verify_retained_trial.py
          python -B research/trials/hc1527_fixed_model_v1/test_verify.py
